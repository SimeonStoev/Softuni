<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="single-post.css">
    <title>Single Post</title>
</head>
<body>
<article>
    <header>
        <h1>Blog Post Title</h1>
        <p>Posted by <span class="author_name">Author Name</span> on
            <time datetime="2024-01-24">January 24, 2024</time>
        </p>
    </header>
    <main>
        <p>This is the introduction of your blog post...</p>
    </main>

    <section>
        <header>
            <h2>Comments</h2>
        </header>
        <div>
            <p><span class="author_name">John Doe</span> -
                <time datetime="2024-01-25">January 25, 2024</time>
            </p>
            <p>This is a comment on the blog post.</p>
        </div>
    </section>
</article>
</body>
</html>
