<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Title</title>
</head>
<body>

<h1>flex-grow</h1>

<h2>flex-grow: 0; (default)</h2>
<div class="flex-container div1">
    <div class="flex-item">1</div>
    <div class="flex-item">2</div>
    <div class="flex-item">3</div>
</div>

<h2>flex-grow: 1;</h2>
<div class="flex-container div2">
    <div class="flex-item">1</div>
    <div class="flex-item">2</div>
    <div class="flex-item">3</div>
</div>


<h2>flex-grow, grow 2nd child only</h2>
<div class="flex-container div3">
    <div class="flex-item">1</div>
    <div class="flex-item">2</div>
    <div class="flex-item">3</div>
</div>


<h2>flex-grow, grow proportionally (1, 2, 3)</h2>
<div class="flex-container div4">
    <div class="flex-item">1</div>
    <div class="flex-item">2</div>
    <div class="flex-item">3</div>
</div>

</body>
</html>
