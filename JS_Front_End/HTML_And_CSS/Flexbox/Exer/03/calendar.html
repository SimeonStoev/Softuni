<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./calendar.css">
    <title>Title</title>
</head>
<body>

<div class="card">
    <div class="inner-card">

        <div class="main-flex">

            <!-- Лява колона — Workweek + Weekend -->
            <div class="left-column">

                <!-- Workweek ред -->
                <div class="section-title">
                    <p>Workweek</p>
                </div>
                <div class="days-row">
                    <div class="day"><p>1 Monday</p></div>
                    <div class="day"><p>2 Tuesday</p></div>
                    <div class="day"><p>3 Wednesday</p></div>
                    <div class="day"><p>4 Thursday</p></div>
                    <div class="day"><p>5 Friday</p></div>
                </div>

                <!-- Weekend ред -->
                <div class="section-title">
                    <p>Weekend</p>
                </div>
                <div class="days-row">
                    <div class="day"><p>6 Saturday</p></div>
                    <div class="day"><p>7 Sunday</p></div>
                </div>

            </div>

            <!-- Дясна колона — REMINDERS + SPECIAL DATES -->
            <div class="right-column">
                <div class="reminder"><p>REMINDERS</p></div>
                <div class="reminder"><p>SPECIAL DATES</p></div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
