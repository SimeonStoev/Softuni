<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./registration.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
</head>
<body>

<div class="card">

    <p class="login">Registration</p>

    <form method="POST" action="#">

        <fieldset>
            <legend>Login information</legend>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <p class="p-descr">example: user@example.com</p>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <p class="p-descr">minimum 6 characters, letters and numbers, at least 1 special character</p>


        </fieldset>

        <fieldset class="second-fieldset">
            <legend>Additional information</legend>
            <label class="second-label" for="date">Date of Birth</label>
            <input type="date" id="date" name="date" required>
            <p class="p-descr">example: john.doe@gmail.com/p>


        </fieldset>

        <input class="submit-btn" type="submit" value="Login">
    </form>
</div>

</body>
</html>
