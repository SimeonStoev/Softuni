<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./custom-checkbox-and-radio.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
</head>
<body>

<div class="card">

    <div class="radio-section">
        <h2>Radio</h2>

        <div class="radio-buttons">
            <div class="radio-group">
                <input type="radio" name="radio-option" id="option1">
                <span class="radio-custom"></span>
                <label for="option1">Option 1</label>
            </div>

            <div class="radio-group">
                <input type="radio" name="radio-option" id="option2">
                <span class="radio-custom"></span>
                <label for="option2">Option 2</label>
            </div>
        </div>
    </div>

    <div class="checkbox-section">
        <h2>Checkbox</h2>

        <div class="checkbox-buttons">
            <div class="checkbox-group">
                <input type="checkbox" name="checkbox-option" id="checkbox1">
                <span class="checkbox-custom"></span>
                <label for="checkbox1">Checkbox 1</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" name="checkbox-option" id="checkbox2">
                <span class="checkbox-custom"></span>
                <label for="checkbox2">Checkbox 2</label>
            </div>
        </div>
    </div>
</div>
</body>
</html>
